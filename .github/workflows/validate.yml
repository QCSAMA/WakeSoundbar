name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Parse every PowerShell source
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '\\dist\\' } | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors.Message -join '; ') }
          }

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          $findings = @(
            Invoke-ScriptAnalyzer -Path .\WakeSoundbar.ps1 -Severity Error
            Invoke-ScriptAnalyzer -Path .\Setup-WakeSoundbar.ps1 -Severity Error
            Invoke-ScriptAnalyzer -Path .\locales\zh-CN\WakeSoundbar.ps1 -Severity Error
          )
          if ($findings) { throw ($findings | Out-String) }

      - name: Enforce ASCII outside translations
        shell: pwsh
        run: |
          Get-ChildItem -File -Recurse | Where-Object {
            $_.FullName -notmatch '\\\.git\\|\\dist\\' -and $_.Extension -in @('.ps1', '.bat', '.md', '.txt', '.yml')
          } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($PWD, $_.FullName).Replace('\', '/')
            $translation = $_.Name -match '^README\.[a-z]{2}(-[A-Z]{2})?\.md$' -or $relative -in @('locales/zh-CN/README.md', 'locales/zh-CN/WakeSoundbar.ps1')
            if (-not $translation -and ([IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 })) {
              throw "Non-ASCII source: $relative"
            }
          }

      - name: Runtime and setup regression tests
        shell: powershell
        run: |
          & .\tests\Test-Runtime.ps1
          & .\tests\Test-Setup.ps1

      - name: Verify release packages
        shell: powershell
        run: .\tools\Build-Release.ps1 -Version 1.1.0
